name: Client Radar Opportunity Scanner

on:
  schedule:
    # Automatically scans every 4 hours throughout the day (Pakistan Time: 4 AM, 8 AM, 12 PM, 4 PM, 8 PM)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web or mobile app anytime

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  scan-and-publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Client Radar Opportunity Scanner
        run: |
          python main.py

      - name: Commit updated leads to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: refresh opportunities [skip ci]"
          git push
        continue-on-error: true

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'output/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
